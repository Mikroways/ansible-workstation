---
workstation_packages:
  - locales
  - bzip2
  - python3
  - python3-venv
  - openssh-server
  - wget
  - curl
  - nmap
  - unzip
  - yamllint
  - git
  - git-extras
  - git-flow
  - git-lfs
  - vim
  - tmux
  - openfortivpn
  - openconnect
  - shellcheck
  - dnsutils
  - ppp
  - nextcloud-desktop-cmd
  - haveged
  - asciinema
  - tree
  - uidmap
  - vagrant
  - swaks
  - zsh
  - xsel
  - xclip
  - libssl-dev
  - libsqlite3-dev
  - sqlite3

workstation_apt_keys:
  - name: hashicorp
    url: https://apt.releases.hashicorp.com/gpg
workstation_repositories:
  - name: hashicorp
    uri: https://apt.releases.hashicorp.com
    suite: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/hashicorp.asc
