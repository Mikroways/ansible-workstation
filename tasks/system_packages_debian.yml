---
- name: Update apt packages
  become: true
  block:
    -
      name: Install essential packages
      ansible.builtin.apt:
        update_cache: yes
        name:
          - python3-pip
          - python3-apt
          - dirmngr
          - gpg
        state: present
    -
      name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    -
      name: Add Apt keys
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/etc/apt/keyrings/{{ item.name }}.asc"
        checksum: "{{ item.checksum | d(omit) }}"
        mode: "0644"
      loop: "{{ workstation_apt_keys }}"
      loop_control:
        label: "{{ item.name }}"
    -
      name: Update apt-get repo and cache
      ansible.builtin.apt:
        update_cache: yes
        force_apt_get: yes
        cache_valid_time: 3600
    -
      name: Add repositories
      ansible.builtin.deb822_repository:
        name: "{{ item.name }}"
        types: deb
        uris: "{{ item.uri }}"
        suites: "{{ item.suite }}"
        components: "{{ item.components | d(['main']) }}"
        architectures: "{{ item.architectures | d(omit) }}"
        signed_by: "{{ item.signed_by | d(omit) }}"
        state: present
      loop: "{{ workstation_repositories }}"
      loop_control:
        label: "{{ item.name }}"
    -
      name: Install systemd-resolved (Debian only — not available as package in Ubuntu)
      ansible.builtin.apt:
        name: systemd-resolved
        state: present
      when: ansible_facts['distribution'] | lower == 'debian'
