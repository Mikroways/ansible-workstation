---
-
  name: Change user shell
  become: true
  ansible.builtin.user:
    shell: /bin/zsh
    name: "{{ ansible_user }}"
-
  name: Create antigen directory
  ansible.builtin.file:
    path: "{{ workstation_antigen_directory }}"
    state: directory
    mode: "0755"
  register: antigen_dir
# In check mode on a fresh host the directory above is only simulated and
# get_url would fail on a missing destination.
-
  name: Download antigen
  when: not (ansible_check_mode and antigen_dir is changed)
  ansible.builtin.get_url:
    url: "{{ workstation_antigen_url }}"
    dest: "{{ workstation_antigen_directory }}/antigen.zsh"
    mode: "0755"
    headers: "{{ {'Authorization': 'token ' + workstation_github_api_token} if (workstation_github_api_token and 'github.com' in workstation_antigen_url) else {} }}"
  register: uri_output
  until: uri_output is success
  retries: 5
  delay: 2
-
  name: Create dotfiles directory
  ansible.builtin.file:
    path: "{{ workstation_dotfiles_directory }}"
    state: directory
    mode: "0755"
# git comes from the system packages installed earlier; in check mode on a
# host without it, the git module fails with "Failed to find required
# executable git". Read-only check, so it runs in check mode too.
-
  name: Check whether git is available
  # Only checks that git exists; the git module would clone.
  ansible.builtin.command: git --version  # noqa: command-instead-of-module
  register: workstation_git_check
  changed_when: false
  failed_when: false
  check_mode: false
-
  name: Download dotfiles
  when: not (ansible_check_mode and workstation_git_check.rc != 0)
  ansible.builtin.git:
    repo: "{{ workstation_dotfiles_repository }}"
    dest: "{{ workstation_dotfiles_directory }}"
    version: "{{ workstation_dotfiles_version | d('master') }}"
-
  name: Install dotfiles
  changed_when: false
  ansible.builtin.command: "{{ workstation_dotfiles_install_script }}"
-
  name: Download dotfiles fonts
  block:
    - name: Create local fonts directory
      ansible.builtin.file:
        path: "{{ workstation_dotfiles_fonts_directory }}"
        state: directory
        mode: "0755"
      register: fonts_dir
    - name: Install required fonts
      when: not (ansible_check_mode and fonts_dir is changed)
      ansible.builtin.get_url:
        url: "{{ item }}"
        mode: "0644"
        dest: "{{ workstation_dotfiles_fonts_directory }}/{{ item | basename }}"
        headers: "{{ {'Authorization': 'token ' + workstation_github_api_token} if (workstation_github_api_token and 'github.com' in item) else {} }}"
      loop: "{{ workstation_dotfiles_fonts }}"
-
  name: "Set direnv configuration directory"
  ansible.builtin.set_fact:
    direnv_config_dir: "{{ ansible_facts['user_dir'] }}/.config/direnv/lib"

-
  name: "Create direnv configuration directory"
  ansible.builtin.file:
    path: "{{ direnv_config_dir }}"
    state: directory
    mode: "0755"
-
  name: "Install direnv helpers"
  # Every file in files/direnv/ becomes a direnv helper (use_*): to add one,
  # drop it in that directory.
  ansible.builtin.copy:
    src: direnv/
    dest: "{{ direnv_config_dir }}/"
    mode: "0755"
