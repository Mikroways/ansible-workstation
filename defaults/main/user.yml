---
# Usuario para el que se configura la workstation: shell zsh, dotfiles, asdf y
# herramientas en su $HOME, y usuario de docker. Por defecto, el usuario con el
# que se conecta Ansible.
#
# Para aplicar el role a otro usuario (por ejemplo, uno sin sudo), conectarse
# con un administrador y usar become_user en el play:
#
#   - hosts: all
#     become: true
#     become_user: runner
#     vars:
#       workstation_user: runner
#     roles:
#       - mikroways.workstation
#
# Las tareas que necesitan root escalan con become_user: root explícito.
workstation_user: "{{ ansible_user }}"
